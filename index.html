
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wheel Random Picker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Be Vietnam Pro',sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#2b2b5a 0%,#121224 40%,#080811 100%);
    color:white;
    overflow-x:hidden;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:30px;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    font-size:48px;
    font-weight:800;
    letter-spacing:-1px;
    margin-bottom:10px;
}

.title p{
    opacity:0.7;
}

.main{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:30px;
}

.panel{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:28px;
    backdrop-filter:blur(14px);
    padding:24px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

textarea{
    width:100%;
    height:420px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    color:white;
    padding:18px;
    font-size:15px;
    resize:none;
    outline:none;
    line-height:1.7;
}

.controls{
    margin-top:18px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

input{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    color:white;
    border-radius:14px;
    padding:14px;
    width:120px;
    font-size:16px;
}

button{
    border:none;
    border-radius:16px;
    padding:14px 22px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    transition:0.25s;
}

.spin-btn{
    background:linear-gradient(135deg,#ff7a18,#ffb800);
    color:#111;
    flex:1;
}

.spin-btn:hover{
    transform:translateY(-2px) scale(1.02);
}

.clear-btn{
    background:rgba(255,255,255,0.08);
    color:white;
}

.wheel-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.pointer{
    width:0;
    height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:40px solid #ffffff;
    position:absolute;
    top:-10px;
    z-index:10;
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.4));
}

canvas{
    width:640px;
    height:640px;
    max-width:100%;
    background:transparent;
}

.result{
    width:100%;
    margin-top:24px;
    background:rgba(255,255,255,0.06);
    border-radius:22px;
    padding:22px;
}

.result h2{
    margin-bottom:18px;
}

.winner-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
}

.winner{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
    padding:16px;
    border-radius:18px;
    font-weight:700;
    font-size:18px;
}

.result-box{
    width:100%;
    margin-top:18px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    color:white;
    padding:14px;
    font-size:15px;
    min-height:120px;
    resize:vertical;
    outline:none;
    line-height:1.7;
}

.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#ffffff;
    color:#111;
    margin-right:10px;
    font-size:14px;
}

@media(max-width:980px){
    .main{
        grid-template-columns:1fr;
    }

    .title h1{
        font-size:36px;
    }

    canvas{
        width:100%;
        height:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="title">
        <h1>Quay số may mắn "Check in VTC"</h1>
        <p>Quay ngẫu nhiên những người may mắn đã tham gia sự kiện</p>
    </div>

    <div class="main">

        <div class="panel">

            <textarea id="names">Thanh Nhã
Trần Nhi
Đình Thuận
Triệu La
Khánh Giang
Nguyễn Dung
Hạ Trang
Nguyễn Trọng Tài Nhân
Lít Nhock
Nguyễn Hoàng Phúc
Gia Bảo Ngô
Dilys Huỳnh
Trần Quân</textarea>

            <div class="controls">
                <input type="number" id="count" value="3" min="1">

                <button class="spin-btn" onclick="spinWheel()">
                    🎯 Quay ngay
                </button>

                <button class="clear-btn" onclick="shuffleNames()">
                    Shuffle
                </button>

                <button class="clear-btn" onclick="clearResult()">
                    Xóa
                </button>
            </div>

        </div>

        <div class="panel wheel-wrap">

            <div class="pointer"></div>

            <canvas id="wheel" width="700" height="700"></canvas>

            <div class="result" id="result">
                <h2>Kết quả</h2>
                <div class="winner-list">
                    <div class="winner">Chưa có kết quả</div>
                </div>

                <textarea class="result-box" id="resultText" readonly>
Kết quả sẽ hiển thị ở đây để copy
                </textarea>
            </div>

        </div>

    </div>

</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');

let rotation = 0;
let spinning = false;

const colors = [
    '#ff6b6b',
    '#feca57',
    '#48dbfb',
    '#1dd1a1',
    '#5f27cd',
    '#ff9ff3',
    '#54a0ff',
    '#00d2d3',
    '#ff9f43',
    '#10ac84'
];

function getNames(){
    return document.getElementById('names')
        .value
        .split('\n')
        .map(x => x.trim())
        .filter(x => x !== '');
}

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function drawWheel(){

    const names = getNames();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if(names.length === 0){
        return;
    }

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 300;

    const slice = (Math.PI * 2) / names.length;

    for(let i = 0; i < names.length; i++){

        const startAngle = rotation + i * slice;
        const endAngle = startAngle + slice;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.save();

        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + slice / 2);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Be Vietnam Pro';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        let text = names[i];

        if(text.length > 18){
            text = text.substring(0, 18) + '...';
        }

        ctx.fillText(text, radius - 20, 0);

        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(centerX, centerY, 55, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.font = 'bold 28px Be Vietnam Pro';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SPIN', centerX, centerY);
}

function spinWheel(){

    if(spinning){
        return;
    }

    const names = getNames();

    if(names.length === 0){
        alert('Chưa có dữ liệu');
        return;
    }

    spinning = true;

    const startRotation = rotation;
    const extraRotation = (Math.PI * 2 * 8) + (Math.random() * Math.PI * 2);
    const targetRotation = startRotation + extraRotation;

    const duration = 5000;
    const startTime = performance.now();

    function animate(currentTime){

        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const ease = 1 - Math.pow(1 - progress, 3);

        rotation = startRotation + (targetRotation - startRotation) * ease;

        drawWheel();

        if(progress < 1){
            requestAnimationFrame(animate);
        }else{
            rotation = targetRotation % (Math.PI * 2);
            drawWheel();
            showResults();
            spinning = false;
        }
    }

    requestAnimationFrame(animate);
}

function showResults(){

    const names = getNames();
    const count = parseInt(document.getElementById('count').value) || 1;

    shuffle(names);

    const winners = names.slice(0, Math.min(count, names.length));

    let html = '<h2>🎉 Kết quả</h2>';
    html += '<div class="winner-list">';

    winners.forEach((name, index) => {
        html += `
            <div class="winner">
                <span class="badge">${index + 1}</span>
                ${name}
            </div>
        `;
    });

    html += '</div>';

    html += `
        <textarea class="result-box" id="resultText" readonly>${winners.join('\n')}</textarea>
    `;

    document.getElementById('result').innerHTML = html;
}

function shuffleNames(){

    const names = getNames();

    shuffle(names);

    document.getElementById('names').value = names.join('\n');

    drawWheel();
}

function clearResult(){

    document.getElementById('result').innerHTML = `
        <h2>Kết quả</h2>
        <div class="winner-list">
            <div class="winner">Chưa có kết quả</div>
        </div>

        <textarea class="result-box" id="resultText" readonly>Kết quả sẽ hiển thị ở đây để copy</textarea>
    `;
}

document.getElementById('names').addEventListener('input', drawWheel);

drawWheel();
</script>

</body>
</html>
